esphome:
  name: ewaterlevel
  friendly_name: E-Waterlevel
  min_version: 2026.9.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components
    components: [ewaterlevel_ble]

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome

esp32_ble_tracker:
  scan_parameters:
    interval: 10ms
    window: 10ms
    active: false
