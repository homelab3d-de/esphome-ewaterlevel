# Alternative to home-assistant.yaml for an irregular tank.
# All raw values and the 40 L full capacity are illustrative; replace them.
packages:
  tank: !include calibration.yaml

sensor:
  - platform: copy
    source_id: water_level_raw
    id: water_volume
    name: Water Volume
    unit_of_measurement: L
    device_class: volume_storage
    state_class: measurement
    entity_category: ""
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            - 0.0 -> 0.0
            - 30.0 -> 10.0
            - 55.0 -> 20.0
            - 85.0 -> 30.0
            - 125.0 -> 40.0
      - lambda: |-
          if (!std::isfinite(x)) return NAN;
          return x < 0.0f ? 0.0f : (x > 40.0f ? 40.0f : x);

  - platform: copy
    source_id: water_volume
    id: water_level_percent
    name: Water Level
    unit_of_measurement: "%"
    device_class: ""
    state_class: measurement
    entity_category: ""
    accuracy_decimals: 0
    filters:
      - lambda: return x * 100.0f / 40.0f;
